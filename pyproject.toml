[project]
name = "synctona"
version = "0.1.0"
description = "MVP высокоскоростного последовательного перевода речи"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "livekit-agents>=1.0.0",
    "livekit-api>=1.0.0",
    "livekit>=1.0.0",         # ← Добавили фикс транзитивного импорта rtc
    "redis>=5.0.0",           # ← Добавили для speaker_registry
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "numpy>=1.24.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]